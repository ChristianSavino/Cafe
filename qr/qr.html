<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Keru's Coffee Bar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="qr.css">
</head>
<body>

<div class="background"></div>

<div class="card">
    <div class="header-group">
        <div class="coffee">☕</div>
        <h1>Keru's Coffee Bar</h1>
        <div class="line"></div>
        <p class="subtitle">Escaneá para descubrir todas las infusiones</p>
    </div>

    <img src="../img/qr.jpg" alt="QR" class="qr">

    <div class="footer-group">
        <p class="scan">
            Abrí la cámara de tu celular<br>
            y apuntá al código QR
        </p>

        <div class="footer">
            <span>☕</span> Hecho con cariño para cada visita
        </div>
    </div>
</div>

</body>
</html>
